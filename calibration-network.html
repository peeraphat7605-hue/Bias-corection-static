<!doctype html><html lang="th"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ผลปรับแก้ฝนรายสถานี</title><script src="plotly.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef4f5;color:#173c48;font:16px/1.55 system-ui}header,main{max-width:1150px;margin:auto;padding:20px}header{background:#163e4a;color:white;max-width:none;padding-inline:max(20px,calc((100vw - 1110px)/2))}h1{margin:.4em 0}nav,.controls,.legend{display:flex;gap:9px;flex-wrap:wrap;align-items:center}nav a,button,select,input{padding:9px 14px;border:1px solid #aac3ca;border-radius:9px;background:white;color:#174751;font:inherit}nav a{font-weight:650;text-decoration:none}a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid orange}section{background:white;padding:16px;margin:16px 0;border-radius:14px}.scroll{overflow-x:auto}table{border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ccdce0;text-align:right;white-space:nowrap}h2{margin:.3em 0}.legend span{border-left:5px solid;padding-left:6px}.chart{min-width:0}</style><header><nav><a href="index.html">ตาราง Ranking</a><a href="map.html">แผนที่สถานี</a><a href="calibration.html">ผลลพบุรีชุดเดิม</a></nav><h1>การปรับแก้ฝนรายสถานี</h1>Historical 1985–2014 · สถานีต้องมีข้อมูลอย่างน้อย 90% ของวันในเดือน</header><main><p id="status" role="status">กำลังตรวจชุดข้อมูลที่เผยแพร่</p><section class="controls" hidden id="controls"><label>ค้นหาสถานี <input id="search" placeholder="รหัสหรือชื่อสถานี"></label><select id="station" aria-label="สถานี"></select><select id="level" aria-label="ระดับเวลา"><option value="mon">ค่าเฉลี่ยรายเดือน</option><option value="year">ยอดรวมรายปี</option><option value="season">ยอดรวมรายฤดู</option></select></section><div class="legend" id="legend"></div><div id="results"></div></main><script>
const el=id=>document.getElementById(id),labels=['สถานี','GCM ดิบ','จับคู่เดือน–ปี','จับคู่เปอร์เซ็นไทล์'],colors=['#171717','#72818b','#00669c','#bc4820'];let catalog={},version=0;
async function json(path){const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw Error(r.status);return r.json()}
function aggregate(rows,level){const groups=new Map();for(const [period,fold,estimated,...values] of rows){const [y,m]=period.split('-').map(Number),key=level==='mon'?period.slice(5):level==='year'?String(y):String(y+(m>=11?1:0))+' '+(m>=5&&m<=10?'Wet':'Dry');const a=groups.get(key)||{n:0,e:0,v:[0,0,0,0]};a.n++;a.e+=estimated?1:0;values.forEach((v,i)=>a.v[i]+=v);groups.set(key,a)}return [...groups].sort(([a],[b])=>a.localeCompare(b)).filter(([,a])=>level==='mon'||a.n===(level==='year'?12:6)).map(([k,a])=>[k,a.n,a.e,...a.v.map(v=>level==='mon'?v/a.n:v)])}
async function draw(){const mine=++version,s=el('station').value,k=el('level').value,root=el('results');root.replaceChildren();if(!s)return;try{const all=await Promise.all(catalog[s].models.map(g=>json('calibration-data/'+s+'/'+encodeURIComponent(g)+'.json')));if(mine!==version)return;for(const r of all){const a=aggregate(r.rows,k),box=document.createElement('section');root.append(box);box.innerHTML='<h2></h2><p></p><div class="chart"></div><details><summary>ดูข้อมูลทุกจุด (mm)</summary><div class="scroll"><table></table></div></details>';box.querySelector('h2').textContent=r.gcm;box.querySelector('p').textContent='ผลเลือกจาก 3 รอบฝึก · '+({same_date:'จับคู่เดือน–ปี',percentile:'จับคู่เปอร์เซ็นไทล์',raw:'ทั้งสองวิธีไม่ลด RMSE จากฝนดิบ',tie:'คะแนนเสมอกัน'})[r.choice]+' · '+a.length+' จุด';if(a.length)Plotly.newPlot(box.querySelector('.chart'),labels.map((name,i)=>({name,x:a.map(d=>d[0]),y:a.map(d=>d[i+3]),mode:'lines+markers',line:{color:colors[i],dash:i===1?'dash':'solid',width:i===0?3:2},hovertemplate:'%{y:.2f} mm<extra>'+name+'</extra>'})),{height:340,margin:{l:60,r:12,t:12,b:65},showlegend:false,hovermode:'x unified',xaxis:{type:'category',automargin:true,nticks:innerWidth<600?6:15},yaxis:{title:'ฝน (mm)',automargin:true}},{responsive:true,displaylogo:false});box.querySelector('table').innerHTML='<tr>'+['ช่วง','เดือนที่ใช้','เดือนประมาณ',...labels].map(x=>'<th>'+x+'</th>').join('')+'</tr>'+a.map(row=>'<tr>'+row.map((v,i)=>'<td>'+(i>2?v.toFixed(2):v)+'</td>').join('')+'</tr>').join('')}}catch(e){if(mine===version)el('status').textContent='เปิดข้อมูลสถานีไม่ได้ '+e.message}}
function options(){let sel=el('station'),old=sel.value;sel.replaceChildren();for(const [id,r] of Object.entries(catalog))if((id+' '+r.name).includes(el('search').value.trim()))sel.add(new Option(id+' · '+r.name,id));if([...sel.options].some(o=>o.value===old))sel.value=old;draw()}
(async()=>{el('controls').style.display='none';try{catalog=await json('calibration-data/catalog.json');el('status').textContent=Object.keys(catalog).length+' สถานี · กราฟจากเดือนที่กันไว้ตรวจ 2000–2014 · ปีและฤดูใช้เฉพาะช่วงครบ';el('controls').style.display='flex';el('controls').hidden=false;el('legend').innerHTML=labels.map((n,i)=>'<span style="border-color:'+colors[i]+'">'+n+'</span>').join('');el('search').oninput=options;el('level').onchange=el('station').onchange=draw;options()}catch(e){el('status').textContent='ยังไม่มีชุดผล 98 สถานีที่เผยแพร่ · เปิดผลทดลองที่มีอยู่จากปุ่ม “ผลลพบุรีชุดเดิม”'}})()</script></html>
